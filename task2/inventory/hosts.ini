# Инвентарь для нод kind-кластера lab5.
# Ноды кластера - это Docker-контейнеры, поэтому вместо SSH
# используется connection-плагин community.docker.docker:
# Ansible заходит в контейнер через docker exec.

[control_plane]
lab5-control-plane

[workers]
lab5-worker
lab5-worker2

[k8s_nodes:children]
control_plane
workers

[k8s_nodes:vars]
ansible_connection=community.docker.docker
ansible_user=root
ansible_python_interpreter=/usr/bin/python3
